<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 45 690 400" width="690" height="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Xbox Classic preset</title>
  <rect x="110" y="45" width="690" height="400" rx="16" fill="#ffffff"/>
  <!-- triggers -->
  <rect x="305" y="126" width="72" height="26" rx="9" fill="#8c959f"/>
  <rect x="523" y="126" width="72" height="26" rx="9" fill="#8c959f"/>
  <text x="341" y="144" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">LT</text>
  <text x="559" y="144" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">RT</text>
  <!-- body: outline drawn under the fill -->
  <g fill="#424a53" stroke="#424a53" stroke-width="6">
    <rect x="290" y="148" width="320" height="150" rx="70"/>
    <ellipse cx="322" cy="300" rx="52" ry="92" transform="rotate(25 322 300)"/>
    <ellipse cx="578" cy="300" rx="52" ry="92" transform="rotate(-25 578 300)"/>
  </g>
  <g fill="#d0d7de">
    <rect x="290" y="148" width="320" height="150" rx="70"/>
    <ellipse cx="322" cy="300" rx="52" ry="92" transform="rotate(25 322 300)"/>
    <ellipse cx="578" cy="300" rx="52" ry="92" transform="rotate(-25 578 300)"/>
  </g>
  <!-- left stick -->
  <circle cx="345" cy="195" r="25" fill="#57606a"/>
  <circle cx="345" cy="195" r="16" fill="#32383f"/>
  <!-- D-pad -->
  <rect x="386" y="233" width="18" height="54" rx="3" fill="#32383f"/>
  <rect x="368" y="251" width="54" height="18" rx="3" fill="#32383f"/>
  <!-- back / start -->
  <circle cx="430" cy="200" r="6" fill="#8c959f"/>
  <circle cx="470" cy="200" r="6" fill="#8c959f"/>
  <!-- right stick -->
  <circle cx="505" cy="262" r="23" fill="#57606a"/>
  <circle cx="505" cy="262" r="15" fill="#32383f"/>
  <!-- face buttons -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#fff">
    <circle cx="555" cy="170" r="13" fill="#d4a72c"/><text x="555" y="175">Y</text>
    <circle cx="580" cy="195" r="13" fill="#cf222e"/><text x="580" y="200">B</text>
    <circle cx="555" cy="220" r="13" fill="#1a7f37"/><text x="555" y="225">A</text>
    <circle cx="530" cy="195" r="13" fill="#0969da"/><text x="530" y="200">X</text>
  </g>
  <!-- callouts -->
  <g stroke="#57606a" stroke-width="1.5" fill="none">
    <polyline points="258,76 300,76 335,128"/>
    <polyline points="258,151 290,151 323,184"/>
    <polyline points="258,216 330,216 391,236"/>
    <polyline points="258,262 369,262"/>
    <polyline points="258,330 330,330 393,285"/>
    <polyline points="430,404 430,330 418,264"/>
    <polyline points="642,76 600,76 565,128"/>
    <polyline points="642,132 600,132 563,161"/>
    <polyline points="642,195 593,195"/>
    <polyline points="642,250 600,250 563,229"/>
    <polyline points="470,104 470,120 521,186"/>
  </g>
  <g font-size="16" fill="#1f2328">
    <g text-anchor="end">
      <text x="250" y="81">Zoom in</text>
      <text x="250" y="156">Look around</text>
      <text x="250" y="221">Mode button 1</text>
      <text x="250" y="267">Select mode</text>
      <text x="250" y="335">Mode button 3</text>
    </g>
    <g text-anchor="start">
      <text x="650" y="81">Zoom out</text>
      <text x="650" y="137">Walk forward</text>
      <text x="650" y="200">Step right</text>
      <text x="650" y="255">Walk backward</text>
    </g>
    <text x="470" y="96" text-anchor="middle">Step left</text>
    <text x="430" y="424" text-anchor="middle">Mode button 2</text>
  </g>
</svg>
