<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font:
          13px system-ui,
          sans-serif;
        width: 260px;
        margin: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      svgp-setting {
        display: block;
      }
      label {
        display: block;
        margin-bottom: 14px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      output {
        font-variant-numeric: tabular-nums;
        opacity: 0.8;
      }
      input[type="range"],
      select {
        width: 100%;
        margin: 0;
      }
      button {
        font: inherit;
        padding: 4px 10px;
      }
      label.check {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #nowPlaying {
        margin: -4px 0 14px;
        padding: 8px;
        border-radius: 6px;
        background: color-mix(in srgb, currentColor 8%, transparent);
      }
      .np-head {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.6;
        margin-bottom: 2px;
      }
      #np-title {
        font-weight: 600;
        color: inherit;
      }
      #np-meta {
        font-size: 12px;
        opacity: 0.75;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Street View Gamepad</h1>
    <svgp-setting
      key="lookSpeedX"
      label="Horizontal look speed (D-pad ←→)"
      type="range"
      min="100"
      max="2400"
      step="20"
    ></svgp-setting>
    <svgp-setting
      key="lookSpeedY"
      label="Vertical look speed (D-pad ↑↓)"
      type="range"
      min="100"
      max="2400"
      step="20"
    ></svgp-setting>
    <svgp-setting key="soundEnabled" label="Ambient sound from nearby recordings" type="checkbox"></svgp-setting>
    <svgp-setting key="masterVolume" label="Master volume" type="range" min="0" max="100" step="1"></svgp-setting>
    <svgp-setting key="volume" label="Soundscape volume" type="range" min="0" max="100" step="1"></svgp-setting>
    <svgp-setting
      key="commentaryVolume"
      label="Commentary volume"
      type="range"
      min="0"
      max="100"
      step="1"
    ></svgp-setting>
    <div id="nowPlaying" hidden>
      <div class="np-head">Now playing</div>
      <a id="np-title" target="_blank"></a>
      <div id="np-meta"></div>
    </div>
    <svgp-setting
      key="logLevel"
      label="Console log level"
      type="select"
      options="off:Off|info:Info (connect/disconnect)|debug:Debug (every button change)"
    ></svgp-setting>
    <button id="mapping">Configure gamepad keys…</button>
    <button id="reset">Reset to defaults</button>
    <script src="dist/popup.js"></script>
  </body>
</html>
